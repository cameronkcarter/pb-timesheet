<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html" class="active">Timesheet</a>
  <a href="projects.html">Projects</a>
  <div class="nav-manage" data-nav="mgr" hidden>
    <a href="approvals.html" data-nav="mgr" hidden>Approvals</a>
    <a href="invoice.html" data-nav="admin" hidden>Invoices</a>
    <a href="setup.html" data-nav="admin" hidden>Setup</a>
    <a href="staff.html" data-nav="admin" hidden>Staff</a>
    <a href="admin.html" data-nav="admin" hidden>Analytics</a>
  </div>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Timesheet</h1>

  <div class="card ts-card">
    <div class="cal-header">
      <h2 id="calLabel"></h2>
      <div class="cal-tools">
        <button type="button" id="calToday" class="secondary small" hidden>Jump to today</button>
        <div class="segmented segmented-small" id="calMode" role="radiogroup" aria-label="Show">
          <button type="button" data-value="weeks" role="radio">Week</button>
          <button type="button" data-value="month" role="radio">Month</button>
        </div>
      </div>
    </div>
    <div class="cal-body">
      <div class="cal-arrows">
        <button type="button" id="calPrev" class="secondary small" aria-label="Earlier" title="Earlier"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="calNext" class="secondary small" aria-label="Later" title="Later"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div id="calendar" class="cal-grid"></div>
    </div>
  </div>

  <div class="card ts-card" id="dayCard">
    <div class="card-head">
      <h2 id="dayHeading"></h2>
    </div>
    <div id="dayEntries"></div>

    <div class="day-log">
      <div class="day-log-title">Log hours</div>
      <div id="projectPicker" class="ts-picker"></div>
      <div id="projectSelected" class="ts-project-selected" hidden></div>
      <div id="projectCardsEmpty" class="empty" style="display:none;">No projects assigned to you yet.</div>
      <div id="noAssignmentsEmpty" class="empty" style="display:none;">You're not assigned to any tasks on this project yet.</div>

      <div id="entryForm" style="display:none;">
        <div id="taskRows" class="ts-tasks" role="radiogroup" aria-label="Task"></div>
        <div class="ts-entry-head" aria-hidden="true"><span>Hours</span><span>Notes</span></div>
        <div class="ts-entry-line">
          <input type="number" id="entryHours" min="0" step="0.25" placeholder="Hrs" aria-label="Hours" />
          <input type="text" id="entryNote" placeholder="What did you work on?" aria-label="Note" />
          <button id="submitEntry">Log Hours</button>
        </div>
        <div id="existingHint" class="entry-status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="card ts-card">
    <div class="card-head">
      <h2>Your Entries <span id="listTitle" class="day-total"></span></h2>
      <div class="list-arrows">
        <button type="button" id="listPrev" class="secondary small" aria-label="Previous month" title="Previous month"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="listNext" class="secondary small" aria-label="Next month" title="Next month"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div id="listView"></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="timesheet.js"></script>
</body>
</html>
