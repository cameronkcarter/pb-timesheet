<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Place Builders</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <img src="Place%20Builder%20Logo.png" alt="Place Builders" class="login-logo" />
    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Who's logging in?</p>

    <div id="personList" class="login-people" role="list"></div>
    <div id="personListEmpty" class="empty" style="display:none; text-align:center;">No people set up yet — add your team in Admin.</div>
    <div id="personListLoading" class="empty" style="text-align:center;">Loading…</div>
  </main>

<script type="module" src="login.js"></script>
</body>
</html>
