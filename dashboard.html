<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard — Place Builders</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="index.html" id="navBrandLink" class="brand">Place Builders</a>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Dashboard</h1>

  <div class="stat-row stat-row-big" id="statRow">
    <div class="stat stat-hours">
      <div class="label">Hours</div>
      <div class="value"><span id="statWeekHours">0</span><span class="unit">hrs logged this week</span></div>
      <div class="assigned-block" id="assignedBlock">
        <div class="assigned-title">On your assigned tasks</div>
        <div class="stat-bar"><div id="statRemainingBar"></div></div>
        <div class="assigned-legend">
          <span><i class="dot logged"></i><strong id="statLogged">0</strong> logged</span>
          <span><i class="dot remaining"></i><strong id="statRemaining">0</strong> remaining</span>
          <span class="assigned-total"><strong id="statAssigned">0</strong> assigned</span>
        </div>
      </div>
      <div class="stat-sub" id="noAssigned" hidden>No hours assigned to you yet.</div>
    </div>
    <div class="stat stat-pay" id="payBox">
      <div class="label">Pay</div>
      <div class="value"><span id="statOwed">$0</span><span class="unit">unpaid</span></div>
      <div class="stat-split">
        <span><i class="dot pending"></i>Not invoiced <strong id="statNotInvoiced">$0</strong></span>
        <span><i class="dot invoiced"></i>Invoiced <strong id="statInvoiced">$0</strong></span>
      </div>
      <button type="button" class="stat-more" id="payToggle" aria-expanded="false" aria-controls="payPanel">Pay stubs <span class="chev" aria-hidden="true">&#9662;</span></button>
    </div>
  </div>

  <div id="payPanel" class="card pay-card" hidden></div>

  <div class="section-head">
    <h2 style="margin:0;">Projects</h2>
    <button id="toggleCompletedBtn" class="secondary small">Hide completed</button>
  </div>
  <div id="projectSummaryCards"></div>

</main>

<div id="toast" class="toast"></div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
