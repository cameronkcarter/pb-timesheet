<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Invoices — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/logo-purple.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html">Admin</a>
  <a href="invoice.html" class="active">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Invoices</h1>

  <div id="invoiceBody">
    <div class="card inv-card">
      <div class="inv-head">
        <h2>Unbilled hours <span class="inv-total" id="nextTotal"></span></h2>
      </div>
      <div id="nextBody"></div>
    </div>

    <div class="card inv-card">
      <div class="inv-head">
        <h2>Sent invoices <span class="inv-total" id="pastTotal"></span></h2>
        <div class="sheet-sync-inline" id="sheetSyncBar" style="display:none;">
          <span class="sheet-sync-label">Google Sheet</span>
          <span id="sheetSyncStatus"></span>
          <a id="sheetOpenLink" class="button-link" target="_blank" rel="noopener" style="display:none;">Open</a>
          <button id="sheetSyncBtn" class="small secondary">Sync</button>
        </div>
      </div>
      <div id="pastBody"></div>
      <button type="button" id="togglePaid" class="link-btn pay-more" style="display:none;"></button>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="invoice.js"></script>
</body>
</html>
