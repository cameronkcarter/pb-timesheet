<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Timesheet — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/logo-purple.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html" class="active">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Timesheet</h1>

  <div class="card">
    <div class="cal-header">
      <h2 style="margin:0;">Your Hours</h2>
      <div class="cal-nav">
        <button id="calPrev" class="secondary small" aria-label="Previous month">&lsaquo;</button>
        <span id="calMonthLabel" class="cal-month-label"></span>
        <button id="calNext" class="secondary small" aria-label="Next month">&rsaquo;</button>
        <button id="calToday" class="secondary small">Today</button>
      </div>
    </div>
    <div id="calLegend" class="cal-legend"></div>
    <div id="calendar" class="cal-grid"></div>

    <div class="day-detail">
      <h3 id="dayHeading"></h3>
      <div id="dayEntries"></div>

      <div class="day-log">
        <div class="day-log-title" id="logTitle"></div>

        <label>Project</label>
        <div id="projectCards" class="project-card-row" style="margin-top:6px;"></div>
        <div id="projectCardsEmpty" class="empty" style="display:none;">No projects assigned to you yet.</div>
        <div id="noAssignmentsEmpty" class="empty" style="display:none;">You're not assigned to any tasks on this project yet.</div>

        <div id="entryForm" style="display:none;">
          <label style="margin-top:14px;">Task</label>
          <div id="taskCards" class="project-card-row" style="margin-top:6px;"></div>

          <div class="inline-form" style="margin-top:14px;">
            <div style="flex:0 0 140px;">
              <label for="entryHours">Hours</label>
              <input type="number" id="entryHours" min="0" step="0.25" placeholder="2" />
            </div>
          </div>

          <label for="entryNote">Note — what did you work on?</label>
          <textarea id="entryNote" rows="3" placeholder="Briefly describe what you worked on..."></textarea>

          <div class="entry-actions">
            <button id="submitEntry" style="margin:0;">Log Hours</button>
            <span id="existingHint" class="entry-status" aria-live="polite"></span>
            <button id="cancelEdit" class="secondary" style="margin:0; visibility:hidden;">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="timesheet.js"></script>
</body>
</html>
