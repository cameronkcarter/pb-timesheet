<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Staff — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <div class="nav-manage" data-nav="mgr" hidden>
    <a href="approvals.html" data-nav="mgr" hidden>Approvals</a>
    <a href="invoice.html" data-nav="admin" hidden>Invoices</a>
    <a href="staff.html" class="active" data-nav="admin" hidden>Staff</a>
    <a href="admin.html" data-nav="admin" hidden>Analytics</a>
  </div>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Staff</h1>

  <div class="card">
    <div class="card-head">
      <h2 style="margin:0;">People &amp; Rates</h2>
      <button type="button" id="openAddPerson" class="small">+ Add Staff</button>
    </div>
    <div class="table-scroll">
      <table id="peopleTable" class="staff-table">
        <thead><tr><th>Name</th><th>Email</th><th class="num">Pay Rate</th><th class="num">Default Bill Rate</th><th class="c-check">Admin</th><th class="c-actions"></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="peopleEmpty" class="empty" style="display:none;">No people added yet.</div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 style="margin:0;">Default Expense Rates</h2>
    </div>
    <div class="cat-grid cat-head"><span>Group</span><span>Category</span><span>Default Rate</span><span>Unit</span><span>Receipt</span><span></span></div>
    <div id="categoryRows"></div>
  </div>
</main>

<div id="personModal" class="modal-overlay" style="display:none;">
  <div class="modal sheet-modal sheet-small" role="dialog" aria-labelledby="personModalTitle">
    <div class="sheet-head">
      <h2 id="personModalTitle">Add Staff</h2>
      <button type="button" id="modalClosePerson" class="icon-btn sheet-close" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="modalPersonName">Name</label>
        <input type="text" id="modalPersonName" placeholder="Full name" autocomplete="off" />
      </div>
      <div class="field">
        <label for="modalPersonEmail">Google email <span class="field-optional">used to sign in</span></label>
        <input type="email" id="modalPersonEmail" placeholder="name@gmail.com" autocomplete="off" />
      </div>
      <div class="field-grid field">
        <div class="field">
          <label for="modalPersonRate">Pay rate <span class="field-optional">what they earn</span></label>
          <div class="money-input"><span>$</span><input type="number" id="modalPersonRate" min="0" step="0.01" placeholder="85" /><span>/hr</span></div>
        </div>
        <div class="field">
          <label for="modalPersonBillRate">Default bill rate <span class="field-optional">charged to clients</span></label>
          <div class="money-input"><span>$</span><input type="number" id="modalPersonBillRate" min="0" step="0.01" placeholder="150" /><span>/hr</span></div>
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" id="modalRemovePerson" class="link-btn item-delete">Remove</button>
      <button type="button" id="modalCancelPerson" class="secondary">Cancel</button>
      <button type="button" id="modalSavePerson">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="staff.js"></script>
</body>
</html>
