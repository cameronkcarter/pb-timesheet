<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Setup — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <div class="nav-manage" data-nav="mgr" hidden>
    <a href="approvals.html" data-nav="mgr" hidden>Approvals</a>
    <a href="invoice.html" data-nav="admin" hidden>Invoices</a>
    <a href="setup.html" class="active" data-nav="admin" hidden>Setup</a>
    <a href="staff.html" data-nav="admin" hidden>Staff</a>
    <a href="admin.html" data-nav="admin" hidden>Analytics</a>
  </div>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Setup</h1>

  <div class="card project-switch">
    <div id="projectPicker"></div>
    <div class="project-head" id="setupHead">
      <div class="project-head-top">
        <div>
          <h2 id="setupHeadName"></h2>
          <div class="project-head-meta" id="setupHeadMeta"></div>
        </div>
        <a id="setupTasksLink" class="head-info-link" href="projects.html">Tasks &amp; Budgets ›</a>
      </div>
    </div>
  </div>

  <div id="setupForm">
    <div class="card">
      <h2>Project Details</h2>
      <div class="field-grid">
        <div class="field field-wide">
          <label for="setupName">Full name <span class="field-optional">as it appears on invoices</span></label>
          <input type="text" id="setupName" placeholder="Roy 1900 West Corridor Study" />
        </div>
        <div class="field">
          <label for="setupClient">Client</label>
          <input type="text" id="setupClient" placeholder="Roy City" />
        </div>
        <div class="field">
          <label for="setupNumber">Project # <span class="field-optional">on invoices</span></label>
          <input type="text" id="setupNumber" placeholder="Client's reference or PO #" />
        </div>
        <div class="field">
          <label for="setupShortName">Short name <span class="field-optional">for project lists</span></label>
          <input type="text" id="setupShortName" maxlength="24" />
        </div>
        <div class="field">
          <label for="setupPm">Project manager <span class="field-optional">approves hours</span></label>
          <select id="setupPm"></select>
        </div>
        <div class="field">
          <label>Billing</label>
          <div class="segmented" id="setupType" role="radiogroup">
            <button type="button" data-value="rates" role="radio">Billed to a client</button>
            <button type="button" data-value="internal" role="radio">Internal</button>
          </div>
          <div class="field-hint" id="setupTypeHint"></div>
        </div>
        <div class="field">
          <label>Color</label>
          <div class="color-swatches" id="setupColor" role="radiogroup" aria-label="Project color"></div>
        </div>
      </div>
    </div>

    <div class="card" id="setupBilling">
      <h2>Invoice To</h2>
      <div class="field-grid">
        <div class="field">
          <label for="setupBillToName">Contact</label>
          <input type="text" id="setupBillToName" placeholder="Jane Smith" />
        </div>
        <div class="field">
          <label for="setupBillToTitle">Title</label>
          <input type="text" id="setupBillToTitle" placeholder="City Manager" />
        </div>
        <div class="field">
          <label for="setupBillToEmail">Email</label>
          <input type="email" id="setupBillToEmail" placeholder="jane@roycity.gov" autocomplete="off" />
        </div>
        <div class="field">
          <label for="setupBillToCompany">Company</label>
          <input type="text" id="setupBillToCompany" placeholder="Roy City" />
        </div>
        <div class="field">
          <label for="setupBillToAddress1">Street</label>
          <input type="text" id="setupBillToAddress1" placeholder="5051 S 1900 W" />
        </div>
        <div class="field">
          <label for="setupBillToAddress2">City, State ZIP</label>
          <input type="text" id="setupBillToAddress2" placeholder="Roy, Utah 84067" />
        </div>
      </div>
    </div>

    <div class="card" id="rates">
      <div class="card-head">
        <h2 style="margin:0;">Rates</h2>
        <button type="button" id="ratesToggle" class="secondary small">Set Project Rates</button>
      </div>
      <div id="ratesSummary" class="rates-summary"></div>
      <div id="ratesEditor" class="setup-rates" hidden>
        <div>
          <h3>Bill Rates</h3>
          <div id="setupBillRates"></div>
        </div>
        <div>
          <h3>Expense Rates</h3>
          <div id="setupExpenseRates"></div>
        </div>
      </div>
    </div>

    <div class="save-bar">
      <button type="button" id="setupRemove" class="link-btn item-delete">Remove Project</button>
      <span id="setupDirty" class="save-bar-note"></span>
      <button type="button" id="setupRevert" class="secondary">Cancel</button>
      <button type="button" id="setupSave">Save Changes</button>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="setup.js"></script>
</body>
</html>
