<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Analytics — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <span class="nav-divider" data-nav="mgr" hidden></span>
  <a href="approvals.html" data-nav="mgr" hidden>Approvals</a>
  <a href="invoice.html" data-nav="admin" hidden>Invoices</a>
  <a href="setup.html" data-nav="admin" hidden>Project setup</a>
  <a href="staff.html" data-nav="admin" hidden>Staff</a>
  <a href="admin.html" class="active" data-nav="admin" hidden>Analytics</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Analytics</h1>

  <div class="card">
    <div class="appr-head">
      <h2>Overview</h2>
      <div class="row-actions">
        <select id="analyticsProject" class="analytics-select" aria-label="Project"></select>
        <div class="segmented segmented-small" id="analyticsRange" role="radiogroup" aria-label="Period">
          <button type="button" data-value="3" role="radio">3 months</button>
          <button type="button" data-value="12" role="radio" class="on">12 months</button>
          <button type="button" data-value="all" role="radio">All time</button>
        </div>
      </div>
    </div>
    <div id="analyticsBody"></div>
  </div>

  <div class="card data-card">
    <h2>Data</h2>
    <div class="data-row" id="sheetRow">
      <div>
        <div class="data-title">Google Sheet</div>
        <div class="data-sub" id="sheetSyncStatus"></div>
      </div>
      <div class="row-actions">
        <a id="sheetOpenLink" class="button-link" target="_blank" rel="noopener" style="display:none;">Open</a>
        <button id="sheetSyncBtn" class="small secondary">Sync</button>
      </div>
    </div>
    <div class="data-row">
      <div>
        <div class="data-title">Backup</div>
        <div class="data-sub" id="backupStatus">Everything, as one file</div>
      </div>
      <button id="downloadExcel" class="secondary small">Download Excel</button>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
