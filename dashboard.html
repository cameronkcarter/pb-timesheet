<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard — Place Builders</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="index.html" id="navBrandLink" class="brand">Place Builders</a>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="schedule.html">Schedule</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <a href="#" id="logoutLink" style="margin-left:auto;">Log Out</a>
</nav>

<main>
  <h1>Dashboard</h1>

  <div class="stat-row">
    <div class="stat">
      <div class="label">Logged This Week</div>
      <div class="value" id="statWeekHours">0</div>
      <div class="empty" style="padding-top:4px;" id="statMonthCaption">0 hrs this month</div>
    </div>
    <div class="stat stage-orange">
      <div class="label">Pending Approval</div>
      <div class="value" id="statPending">$0</div>
    </div>
    <div class="stat stage-teal">
      <div class="label">Approved</div>
      <div class="value" id="statApproved">$0</div>
    </div>
    <div class="stat stage-blue">
      <div class="label">Invoiced</div>
      <div class="value" id="statInvoiced">$0</div>
    </div>
    <div class="stat stage-green">
      <div class="label">Paid</div>
      <div class="value" id="statPaid">$0</div>
    </div>
  </div>

  <div class="card">
    <h2>Due Dates</h2>
    <table id="dueDatesTable">
      <thead><tr><th>Event</th><th>Project</th><th>Due Date</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="dueDatesEmpty" class="empty" style="display:none;">No upcoming due dates.</div>
  </div>

  <h2 style="margin:28px 0 12px;">Projects</h2>
  <div id="projectSummaryCards"></div>
</main>

<script type="module" src="dashboard.js"></script>
</body>
</html>
