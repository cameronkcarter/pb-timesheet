<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Schedule — Place Builders</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="index.html" id="navBrandLink" class="brand">Place Builders</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="schedule.html" class="active">Schedule</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Schedule</h1>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">Timeline</h2>
      <button id="openAddEvent" class="secondary small">+ Add Event</button>
    </div>
    <div class="gantt-legend">
      <span><span class="legend-dot legend-dot-event"></span>Event</span>
      <span><span class="legend-dot legend-dot-assignment"></span>Assignment</span>
    </div>
    <div id="ganttEmpty" class="empty" style="display:none;">No projects yet.</div>
    <div id="ganttScroll" class="gantt-scroll">
      <div id="ganttChart"></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">Assignments</h2>
      <div class="row-actions">
        <button id="toggleCompletedBtn" class="secondary small">Show Completed</button>
        <button id="openAddAssignment" class="secondary small">+ Add Assignment</button>
      </div>
    </div>
    <div id="assignmentsList" style="margin-top:16px;"></div>
  </div>
</main>

<div id="dueDateModal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:520px;">
    <h2 id="dueDateModalTitle">Add Event</h2>

    <label for="ddProject">Project</label>
    <select id="ddProject"></select>

    <div id="ddTaskRow">
      <label for="ddTask" id="ddTaskLabel">Task</label>
      <select id="ddTask">
        <option value="">No specific task</option>
      </select>
    </div>

    <label for="ddTitle">Name</label>
    <input type="text" id="ddTitle" placeholder="Community Workshop" />

    <label for="ddDate">Date</label>
    <input type="date" id="ddDate" />
    <div id="ddHoursField" style="display:none;">
      <label for="ddHours">Estimated hours (optional)</label>
      <input type="number" id="ddHours" min="0" step="0.25" placeholder="6" />
    </div>

    <div id="ddPeopleField">
      <label>Assigned to</label>
      <div id="ddPeoplePills" class="dd-people-pills"></div>
    </div>

    <div class="row-actions" style="margin-top:20px; justify-content:space-between;">
      <button id="modalDeleteDueDate" class="danger" style="display:none;">Delete</button>
      <div class="row-actions" style="margin-left:auto;">
        <button id="modalCancelDueDate" class="secondary">Cancel</button>
        <button id="modalSaveDueDate">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="timelineModal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <h2 id="timelineModalTitle">Edit Timeline</h2>
    <div id="timelineModalRows"></div>
    <div class="row-actions" style="margin-top:20px; justify-content:flex-end;">
      <button id="modalCancelTimeline" class="secondary">Cancel</button>
      <button id="modalSaveTimeline">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="schedule.js"></script>
</body>
</html>
