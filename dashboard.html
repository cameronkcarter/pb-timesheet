<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/logo-purple.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Dashboard</h1>

  <div class="stat-row stat-row-big" id="statRow">
    <div class="stat stat-hours">
      <div class="label">Hours</div>
      <div class="hours-split">
        <div class="hours-weeks">
          <div class="value"><span id="statWeekHours">0</span><span class="unit">hrs logged this week</span></div>
          <div class="week-chart" id="weekChart"></div>
        </div>
        <div class="hours-remaining">
          <div class="value" id="statRemaining">0</div>
          <div class="unit">hrs remaining</div>
        </div>
      </div>
    </div>
    <div class="stat stat-pay" id="payBox">
      <div class="label">Pay</div>
      <div class="value"><span id="statOwed">$0</span><span class="unit">unpaid</span></div>
      <div class="stat-split">
        <span><i class="dot pending"></i>Not invoiced <strong id="statNotInvoiced">$0</strong></span>
        <span><i class="dot invoiced"></i>Invoiced <strong id="statInvoiced">$0</strong></span>
      </div>
      <button type="button" class="stat-more" id="payToggle" aria-expanded="false" aria-controls="payPanel">Your invoices <span class="chev" aria-hidden="true">&#9662;</span></button>
    </div>
  </div>

  <div id="payPanel" class="card pay-card" hidden></div>

  <div class="section-head">
    <h2 style="margin:0;">Projects</h2>
    <button id="toggleCompletedBtn" class="secondary small">Hide completed</button>
  </div>
  <div id="projectSummaryCards"></div>

</main>

<div id="toast" class="toast"></div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
