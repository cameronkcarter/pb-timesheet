<main>
  <h1>Invoices</h1>

  <div id="invoiceBody">
    <div class="card inv-card">
      <div class="inv-head">
        <h2>Ready to invoice</h2>
      </div>
      <p class="inv-intro">Approved hours and expenses not invoiced yet, by project. Click <strong>Review</strong> to check them and create the invoice.</p>
      <div id="nextBody"></div>
    </div>

    <div class="card inv-card">
      <div class="inv-head">
        <h2>Sent invoices <span class="inv-total" id="pastTotal"></span></h2>
      </div>
      <div id="pastBody"></div>
      <button type="button" id="togglePaid" class="link-btn pay-more" style="display:none;"></button>
    </div>

    <div class="card inv-card">
      <div class="inv-head">
        <h2>Subconsultant invoices <span class="inv-total" id="subTotal"></span></h2>
        <button type="button" id="recordSubInvoice" class="small btn-tint-purple">+ Record invoice</button>
      </div>
      <div id="subBody"></div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
