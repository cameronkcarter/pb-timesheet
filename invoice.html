<main>
  <h1>Invoices</h1>

  <div id="invoiceBody">
    <div class="card inv-card">
      <div class="inv-head">
        <h2>Ready to Invoice</h2>
      </div>
      <div id="nextBody"></div>
    </div>

    <div class="card inv-card">
      <div class="inv-head">
        <h2>Sent Invoices <span class="inv-total" id="pastTotal"></span></h2>
      </div>
      <div id="pastBody"></div>
      <button type="button" id="togglePaid" class="link-btn pay-more" style="display:none;"></button>
    </div>

    <div class="card inv-card">
      <div class="inv-head">
        <h2>Subconsultant Invoices <span class="inv-total" id="subTotal"></span></h2>
        <button type="button" id="recordSubInvoice" class="small secondary">+ Record Invoice</button>
      </div>
      <div id="subBody"></div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>
