<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Invoices — Place Builders</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand">Place Builders</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html">Admin</a>

  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Invoices</h1>

  <div class="card inv-card">
    <div class="inv-head">
      <div class="inv-totals" id="invoiceTotals"></div>
      <div class="sheet-sync-inline" id="sheetSyncBar" style="display:none;">
        <span class="sheet-sync-label">Google Sheet</span>
        <span id="sheetSyncStatus"></span>
        <a id="sheetOpenLink" class="button-link" target="_blank" rel="noopener" style="display:none;">Open</a>
        <button id="sheetSyncBtn" class="small secondary">Sync</button>
      </div>
    </div>
    <div id="invoiceBody"></div>
    <button type="button" id="togglePaid" class="link-btn pay-more" style="display:none;"></button>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
