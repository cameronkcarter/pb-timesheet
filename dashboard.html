<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard — Place Builders</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="index.html" id="navBrandLink" class="brand">Place Builders</a>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Dashboard</h1>

  <div class="stat-row stat-row-big">
    <div class="stat">
      <div class="label">Timesheet</div>
      <div class="value"><span id="statWeekHours">0</span><span class="unit">hrs this week</span></div>
      <div class="stat-sub" id="statWeekCaption"></div>
    </div>
    <div class="stat">
      <div class="label">Hours</div>
      <div class="value"><span id="statRemaining">0</span><span class="unit">hrs remaining</span></div>
      <div class="stat-bar"><div id="statRemainingBar"></div></div>
      <div class="stat-sub" id="statRemainingCaption"></div>
    </div>
    <button type="button" class="stat stat-button" id="payToggle" aria-expanded="false" aria-controls="payPanel">
      <div class="label">Pay</div>
      <div class="value"><span id="statOwed">$0</span><span class="unit">unpaid</span></div>
      <div class="stat-split">
        <span><i class="dot pending"></i>Not invoiced <strong id="statNotInvoiced">$0</strong></span>
        <span><i class="dot invoiced"></i>Invoiced <strong id="statInvoiced">$0</strong></span>
      </div>
      <div class="stat-more">Pay stubs <span class="chev" aria-hidden="true">&#9662;</span></div>
    </button>
  </div>

  <div id="payPanel" class="pay-panel" hidden></div>

  <div class="section-head">
    <h2 style="margin:0;">Projects</h2>
    <button id="toggleCompletedBtn" class="secondary small">Hide completed</button>
  </div>
  <div id="projectSummaryCards"></div>

</main>

<div id="toast" class="toast"></div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
