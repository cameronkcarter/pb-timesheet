<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Projects — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/logo-purple.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html" class="active">Projects</a>
  <a href="admin.html" id="navAdminLink" style="display:none;">Admin</a>
  <a href="invoice.html" id="navInvoiceLink" style="display:none;">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Projects</h1>

  <div class="card">
    <div id="projectCards" class="project-card-row" style="margin-top:0;"></div>
    <div id="projectCardsEmpty" class="empty" style="display:none;">No projects to show yet.</div>
  </div>

  <div id="projectDetail" style="display:none;">
    <div class="card">
      <div class="budget-header">
        <h2 style="margin:0;">Budget</h2>
        <div id="budgetSummary" class="budget-summary"></div>
      </div>
      <div id="budgetOverallBar" style="margin-top:12px;"></div>
      <table id="budgetTable" style="margin-top:18px;">
        <thead><tr><th>Task</th><th>Budget</th><th>Spent</th><th style="width:160px;">Progress</th><th>Remaining</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="budgetEmpty" class="empty" style="display:none;">No tasks set up for this project yet.</div>
      <div id="generalItems"></div>
      <div class="budget-foot">
        <div id="budgetHint" class="empty" style="padding:0;">Click a task to see who's assigned to it.</div>
        <div class="row-actions">
          <button id="toggleCompletedBtn" class="secondary small">Hide completed</button>
          <button id="openAddAssignment" class="secondary small">+ Assign subtask</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Timeline</h2>
        <button id="openAddEvent" class="secondary small">+ Add Event</button>
      </div>
      <div class="gantt-legend">
        <span><span class="legend-dot legend-dot-event"></span>Event</span>
        <span><span class="legend-dot legend-dot-assignment"></span>Assignment</span>
      </div>
      <div id="ganttEmpty" class="empty" style="display:none;">No task dates set for this project yet.</div>
      <div id="ganttScroll" class="gantt-scroll">
        <div id="ganttChart"></div>
      </div>
    </div>

  </div>
</main>

<div id="timelineModal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <h2 id="timelineModalTitle">Edit Timeline</h2>
    <div id="timelineModalRows"></div>
    <div class="row-actions" style="margin-top:20px; justify-content:flex-end;">
      <button id="modalCancelTimeline" class="secondary">Cancel</button>
      <button id="modalSaveTimeline">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="projects.js"></script>
</body>
</html>
