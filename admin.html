<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/logo-purple.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="admin.html" class="active">Admin</a>
  <a href="invoice.html">Invoices</a>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Admin</h1>

  <div class="card" id="pendingApprovalCard">
    <div class="appr-head">
      <h2>Approvals <span id="pendingTotal"></span></h2>
      <div class="row-actions">
        <div class="segmented segmented-small" id="approvalView" role="radiogroup">
          <button type="button" data-value="pending" role="radio" class="on">Pending</button>
          <button type="button" data-value="approved" role="radio">Approved</button>
        </div>
        <div class="segmented segmented-small" id="approvalScope" role="radiogroup">
          <button type="button" data-value="mine" role="radio" class="on">Assigned projects</button>
          <button type="button" data-value="all" role="radio">All projects</button>
        </div>
        <button id="approveAllBtn" class="small">Approve all</button>
      </div>
    </div>
    <div id="pendingBody"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">People &amp; Rates</h2>
      <button id="openAddPerson" class="secondary small">+ Add Person</button>
    </div>
    <table id="peopleTable" style="margin-top:16px;">
      <thead><tr><th>Name</th><th>Pay Rate</th><th>Bill Rate</th><th style="width:150px;"></th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="peopleEmpty" class="empty" style="display:none;">No people added yet.</div>
  </div>

  <div class="card backup-card">
    <h2>Backup</h2>
    <button id="downloadBackup" class="secondary small">Download</button>
  </div>
</main>

<div id="personModal" class="modal-overlay" style="display:none;">
  <div class="modal sheet-modal sheet-small" role="dialog" aria-labelledby="modalPersonName">
    <div class="sheet-head">
      <div class="sheet-kicker" id="personModalTitle">New person</div>
      <input type="text" id="modalPersonName" class="title-input" placeholder="Full name" />
      <button type="button" id="modalClosePerson" class="icon-btn sheet-close" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="modalPersonEmail">Google email</label>
        <input type="email" id="modalPersonEmail" placeholder="name@gmail.com" autocomplete="off" />
        <div class="field-hint">Used to sign in</div>
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="modalPersonRate">Pay rate</label>
          <div class="money-input"><span>$</span><input type="number" id="modalPersonRate" min="0" step="0.01" placeholder="85" /><span>/hr</span></div>
          <div class="field-hint">What they earn</div>
        </div>
        <div class="field">
          <label for="modalPersonBillRate">Bill rate</label>
          <div class="money-input"><span>$</span><input type="number" id="modalPersonBillRate" min="0" step="0.01" placeholder="150" /><span>/hr</span></div>
          <div class="field-hint">What clients are charged</div>
        </div>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="modalPersonAdmin" />
        Admin access (Admin and Invoices pages)
      </label>
    </div>
    <div class="sheet-foot">
      <button type="button" id="modalCancelPerson" class="secondary">Cancel</button>
      <button type="button" id="modalSavePerson">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
