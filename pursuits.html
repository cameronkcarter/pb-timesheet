<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Pursuits — Place Builders</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="icon" type="image/png" href="brand/favicon.png" />
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="pursuits-page">
<nav>
  <a href="dashboard.html" id="navBrandLink" class="brand"><img src="brand/wordmark-white.png" alt="Place Builders" /></a>
  <a href="dashboard.html">Dashboard</a>
  <a href="timesheet.html">Timesheet</a>
  <a href="projects.html">Projects</a>
  <a href="pursuits.html" class="active">Pursuits</a>
  <div class="nav-manage" data-nav="mgr" hidden>
    <a href="approvals.html" data-nav="mgr" hidden>Approvals</a>
    <a href="invoice.html" data-nav="admin" hidden>Invoices</a>
    <a href="staff.html" data-nav="admin" hidden>Staff</a>
    <a href="admin.html" data-nav="admin" hidden>Analytics</a>
  </div>
  <span id="navUserName" class="nav-user-name" style="margin-left:auto;"></span>
  <a href="#" id="logoutLink">Log Out</a>
</nav>

<main>
  <h1>Pursuits</h1>

  <div class="card" id="moveCard" hidden></div>

  <div class="card project-switch">
    <div id="pursuitsEmpty" class="empty" style="display:none;">No Pursuits yet.</div>
    <div id="pursuitPicker"></div>
    <div class="project-head pursuit-hero" id="pursuitHero"></div>
  </div>

  <div class="pursuits-layout" id="pursuitsLayout">
    <section class="pursuit-main" id="pursuitMain">

      <div class="card pursuit-tasks" id="pursuitTasksCard">
        <div class="pursuit-tasks-head">
          <h2>Open Tasks <span class="section-meta" id="openCount"></span></h2>
          <div class="pursuit-tasks-actions">
            <button type="button" class="link-btn" id="quickAddBtn">+ Add Task</button>
            <button type="button" class="small secondary" id="editTasksBtn">Edit Tasks</button>
          </div>
        </div>
        <div class="pursuit-task-cols" id="taskCols"><div><span></span><span>Task</span><span class="num">People</span><span class="num">Hours</span><span class="num cost-col">Cost</span><span class="num cost-col">Budget</span></div><span></span></div>
        <div id="openTasks"></div>
        <button type="button" class="pursuit-closed-toggle" id="closedTasksToggle" hidden></button>
        <div id="closedTasks" hidden></div>
      </div>
    </section>
  </div>
</main>

<div id="pursuitModal" class="modal-overlay" style="display:none;">
  <div class="modal sheet-modal pursuit-modal" role="dialog" aria-labelledby="pursuitModalTitle">
    <div class="sheet-head">
      <div><h2 id="pursuitModalTitle">Edit Pursuit</h2></div>
      <button type="button" id="pursuitModalClose" class="icon-btn sheet-close" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body">
      <div class="field-grid">
        <div class="field field-wide">
          <label for="pursuitName">Name</label>
          <input type="text" id="pursuitName" placeholder="RFPs" />
        </div>
        <div class="field" style="grid-column:1;">
          <label for="pursuitShortName">Short name <span class="field-optional">for lists</span></label>
          <input type="text" id="pursuitShortName" maxlength="24" />
        </div>
        <div class="field" style="grid-column:1;">
          <label>Pay</label>
          <div class="segmented pay-choice" id="pursuitPay" role="radiogroup" aria-label="Pay">
            <button type="button" data-value="unpaid" role="radio">Unpaid</button>
            <button type="button" data-value="payable" role="radio">Payable</button>
          </div>
          <div class="field-hint" id="pursuitPayHint"></div>
        </div>
        <div class="field" id="pursuitPmField">
          <label for="pursuitPm">PM <span class="field-optional">approves the hours</span></label>
          <select id="pursuitPm"></select>
        </div>
        <div class="field" id="pursuitTargetField" style="grid-column:1;">
          <label for="pursuitTarget">Budget <span class="field-optional">at pay rates</span></label>
          <input type="number" id="pursuitTarget" min="0" step="100" placeholder="None" />
        </div>
        <div class="field field-wide">
          <label>Color</label>
          <div class="color-swatches" id="pursuitColor" role="radiogroup" aria-label="Color"></div>
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" id="pursuitRemove" class="link-btn item-delete">Remove</button>
      <button type="button" id="pursuitCancel" class="secondary">Cancel</button>
      <button type="button" id="pursuitSave">Save</button>
    </div>
  </div>
</div>

<div id="tasksModal" class="modal-overlay" style="display:none;">
  <div class="modal sheet-modal pursuit-modal" role="dialog" aria-labelledby="tasksModalTitle">
    <div class="sheet-head">
      <div><h2 id="tasksModalTitle">Edit Tasks</h2><div class="sheet-sub" id="tasksModalName"></div></div>
      <button type="button" id="tasksModalClose" class="icon-btn sheet-close" aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body">
      <div class="edit-tasks-head"><span>Task</span><span class="num">Hours</span><span class="num target-col">Budget $</span><span>Closed</span><span></span></div>
      <div id="tasksModalRows"></div>
      <button type="button" id="tasksModalAdd" class="link-btn">+ Add Task</button>
    </div>
    <div class="sheet-foot">
      <button type="button" id="tasksModalCancel" class="secondary">Cancel</button>
      <button type="button" id="tasksModalSave">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="pursuits.js"></script>
</body>
</html>
